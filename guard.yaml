packages:
  stock: !include stock.yaml
substitutions:
  project_version: "battery-guard-1.10"
  log_level: INFO
esphome:
  includes:
    - guard.h
wifi:
  reboot_timeout: 0s
update:
  - id: !remove update_http_request
external_components:
  - source:
      type: local
      path: components
    components: [battery_light_stream]
battery_light_stream:
  id: battery_stream
  pin:
    number: ${RF_RX_PIN}
    inverted: true
    allow_other_uses: true
  on_code:
    - lambda: |-
        if (battery_guard::instance.receive(code, millis()))
          ESP_LOGI("battery_guard", "BGSTREAM code=%08X", static_cast<unsigned int>(code));
# The GPIO stream above is the only battery-light decoder. The RMT receiver now serves only
# learning and the RF proxy, which feeds HA's raw recorder; its capture settings are unchanged
# from v1.9 so recorded bursts stay comparable. It no longer copies bursts into an on_raw lambda.
remote_receiver:
  - id: !extend rf_receiver
    pin:
      number: ${RF_RX_PIN}
      inverted: true
      allow_other_uses: true
    # Classic ESP32 hardware filtering is capped near 3.2us by the APB clock.
    filter: 250us
    idle: 6ms
    receive_symbols: 512
    buffer_size: 10000b
# Guard state is published when it changes (see the 100ms interval), not polled.
text_sensor:
  - platform: template
    id: guard_command
    name: "Battery Light Last Command"
    update_interval: never
  - platform: template
    id: guard_status
    name: "Battery Light Protection"
    update_interval: never
  - platform: template
    id: guard_action
    name: "Battery Light Last Action"
    update_interval: never
sensor:
  - platform: template
    name: "Battery Light Stream Edges"
    accuracy_decimals: 0
    lambda: return id(battery_stream).edges();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Overflows"
    accuracy_decimals: 0
    lambda: return id(battery_stream).overflows();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Discontinuities"
    accuracy_decimals: 0
    lambda: return id(battery_stream).discontinuities();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Frames"
    accuracy_decimals: 0
    lambda: return id(battery_stream).frames();
    update_interval: 30s
  - platform: template
    name: "Battery Light Edge Traces"
    accuracy_decimals: 0
    lambda: return id(battery_stream).edge_traces();
    update_interval: 30s
  - platform: template
    name: "Battery Light Receiver Errors"
    accuracy_decimals: 0
    lambda: return battery_guard::receiver_errors;
    update_interval: 30s
  - platform: template
    name: "Battery Light Fallback Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    lambda: return battery_guard::instance.remaining(millis());
    update_interval: 5s
  - platform: template
    id: guard_count
    name: "Battery Light Command Count"
    accuracy_decimals: 0
    update_interval: never
  # Largest single allocatable block. Total free heap hides fragmentation.
  - platform: debug
    block:
      name: "Heap Max Block"
      unit_of_measurement: "KiB"
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
interval:
  - interval: 250ms
    then:
      - lambda: |-
          char record[1536];
          if (id(battery_stream).next_edge_dump(record, sizeof(record)))
            ESP_LOGI("battery_guard_edges", "%s", record);
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return battery_guard::instance.tick(millis());
          then:
            - script.execute: battery_light_off
  - interval: 100ms
    then:
      - lambda: |-
          static uint32_t published = UINT32_MAX;
          auto &g = battery_guard::instance;
          if (g.changes == published) return;
          published = g.changes;
          id(guard_command).publish_state(g.command);
          id(guard_status).publish_state(g.status);
          id(guard_action).publish_state(g.action);
          id(guard_count).publish_state(g.count);
  # wifi/api reboot_timeout stay 0s so a reboot never cancels a pending Off. Instead, restart
  # after 10 minutes without Home Assistant, only while no fallback countdown is running.
  - interval: 30s
    then:
      - lambda: |-
          bool connected = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (battery_guard::recovery.should_restart(connected, battery_guard::instance.active, millis())) {
            ESP_LOGW("battery_guard", "No Home Assistant connection for 10 minutes and no fallback pending; restarting");
            App.safe_reboot();
          }
script:
  - id: battery_light_off
    mode: single
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: [8182, -4009, 504, -1598, 497, -1599, 496, -1599, 497, -523, 490, -523, 490, -523, 491, -524, 489, -529, 490, -1602, 494, -523, 490, -523, 490, -1599, 496, -521, 492, -1598, 496, -1600, 496, -529, 492, -521, 491, -524, 490, -521, 491, -1598, 495, -1600, 497, -523, 490, -521, 492, -530, 490, -523, 490, -523, 490, -522, 490, -1598, 497, -523, 490, -523, 492, -521, 490, -1597, 496, -1641, 8180, -4007, 505, -1598, 497, -1596, 497, -1600, 496, -521, 493, -523, 489, -523, 490, -522, 491, -528, 491, -1599, 495, -523, 492, -520, 491, -1599, 497, -521, 490, -1597, 497, -1600, 495, -530, 490, -523, 490, -523, 490, -523, 489, -1598, 497, -1598, 497, -520, 492, -521, 492, -529, 491, -521, 491, -522, 492, -521, 490, -1600, 494, -523, 490, -523, 490, -523, 489, -1596, 495, -1642, 8179, -4004, 506, -1596, 497, -1597, 497, -1598, 495, -525, 489, -521, 491, -522, 491, -522, 490, -528, 492, -1597, 497, -521, 490, -523, 490, -1597, 497, -521, 490, -1597, 496, -1599, 495, -530, 490, -523, 490, -523, 489, -521, 490, -1598, 497, -1597, 497, -521, 491, -522, 490, -530, 490, -523, 490, -521, 492, -520, 491, -1599, 495, -523, 490, -522, 491, -520, 490, -1596, 496, -1640, 8177, -4005, 506, -1595, 497, -1598, 496, -1598, 496, -522, 491, -520, 492, -523, 490, -521, 491, -528, 491, -1597, 497, -521, 492, -520, 491, -1599, 495, -520, 491, -1597, 497, -1597, 495, -530, 490, -523, 490, -521, 492, -521, 490, -1597, 497, -1595, 498, -522, 490, -523, 490, -530, 489, -522, 490, -523, 490, -520, 491, -1597, 497, -522, 491, -522, 489, -522, 490, -1595, 495, -1640]
button:
  - platform: template
    name: "Battery Light Verified Power Off"
    on_press:
      - lambda: battery_guard::instance.manual_off();
      - script.execute: battery_light_off

logger:
  tx_buffer_size: 2048
  on_message:
    - lambda: |-
        if (level <= 2 && strncmp(tag, "remote_receiver", 15) == 0)
          ++battery_guard::receiver_errors;
