packages:
  stock: !include stock.yaml
substitutions:
  project_version: "battery-guard-1.9"
  log_level: INFO
esphome:
  includes:
    - guard.h
    - diagnostics.h
wifi:
  reboot_timeout: 0s
update:
  - id: !remove update_http_request
external_components:
  - source:
      type: local
      path: components
    components: [battery_light_stream]
battery_light_stream:
  id: battery_stream
  pin:
    number: ${RF_RX_PIN}
    inverted: true
    allow_other_uses: true
  on_code:
    - lambda: |-
        if (battery_guard::instance.receive(code, millis()))
          ESP_LOGI("battery_guard", "BGSTREAM code=%08X", static_cast<unsigned int>(code));
remote_receiver:
  - id: !extend rf_receiver
    pin:
      number: ${RF_RX_PIN}
      inverted: true
      allow_other_uses: true
    # Post-capture filtering for the existing RMT proxy/learning path.
    # Classic ESP32 hardware filtering is capped near 3.2us by the APB clock.
    # The independent GPIO stream above avoids RMT packet truncation.
    filter: 250us
    idle: 6ms
    receive_symbols: 512
    buffer_size: 10000b
    on_raw:
      - lambda: |-
          battery_guard::diagnostics.observe(x.data(), x.size(), millis());
          for (size_t i = 0; i + 67 <= x.size(); ++i) {
            auto code = battery_guard::frame(x.data(), x.size(), i);
            if (code && battery_guard::instance.receive(code, millis())) {
              ESP_LOGI("battery_guard", "Heard %s", battery_guard::instance.command);
            }
          }
text_sensor:
  - platform: template
    name: "Battery Light Last Command"
    lambda: return std::string(battery_guard::instance.command);
    update_interval: 1s
  - platform: template
    name: "Battery Light Protection"
    lambda: return std::string(battery_guard::instance.status);
    update_interval: 1s
  - platform: template
    name: "Battery Light Last Action"
    lambda: return std::string(battery_guard::instance.action);
    update_interval: 1s
sensor:
  - platform: template
    name: "Battery Light Stream Edges"
    accuracy_decimals: 0
    lambda: return id(battery_stream).edges();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Overflows"
    accuracy_decimals: 0
    lambda: return id(battery_stream).overflows();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Discontinuities"
    accuracy_decimals: 0
    lambda: return id(battery_stream).discontinuities();
    update_interval: 30s
  - platform: template
    name: "Battery Light Stream Frames"
    accuracy_decimals: 0
    lambda: return id(battery_stream).frames();
    update_interval: 1s
  - platform: template
    name: "Battery Light Edge Traces"
    accuracy_decimals: 0
    lambda: return id(battery_stream).edge_traces();
    update_interval: 30s
  - platform: template
    name: "Battery Light Raw Bursts"
    accuracy_decimals: 0
    lambda: return battery_guard::diagnostics.raw_bursts;
    update_interval: 30s
  - platform: template
    name: "Battery Light Rejected Candidates"
    accuracy_decimals: 0
    lambda: return battery_guard::diagnostics.rejected_frames;
    update_interval: 30s
  - platform: template
    name: "Battery Light Receiver Errors"
    accuracy_decimals: 0
    lambda: return battery_guard::diagnostics.receiver_errors;
    update_interval: 30s
  - platform: template
    name: "Battery Light Diagnostic Overwrites"
    accuracy_decimals: 0
    lambda: |-
      return battery_guard::diagnostics.sequence > 12 ? battery_guard::diagnostics.sequence - 12 : 0;
    update_interval: 30s
  - platform: template
    name: "Battery Light Fallback Remaining"
    unit_of_measurement: s
    accuracy_decimals: 0
    lambda: return battery_guard::instance.remaining(millis());
    update_interval: 5s
  - platform: template
    name: "Battery Light Command Count"
    accuracy_decimals: 0
    lambda: return battery_guard::instance.count;
    update_interval: 1s
interval:
  - interval: 250ms
    then:
      - lambda: |-
          char record[1536];
          if (battery_guard::diagnostics.next_dump(record, sizeof(record)))
            ESP_LOGI("battery_guard_diag", "%s", record);
          if (id(battery_stream).next_edge_dump(record, sizeof(record)))
            ESP_LOGI("battery_guard_edges", "%s", record);
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return battery_guard::instance.tick(millis());
          then:
            - script.execute: battery_light_off
script:
  - id: battery_light_off
    mode: single
    then:
      - remote_transmitter.transmit_raw:
          transmitter_id: rf_transmitter
          carrier_frequency: 0Hz
          code: [8182, -4009, 504, -1598, 497, -1599, 496, -1599, 497, -523, 490, -523, 490, -523, 491, -524, 489, -529, 490, -1602, 494, -523, 490, -523, 490, -1599, 496, -521, 492, -1598, 496, -1600, 496, -529, 492, -521, 491, -524, 490, -521, 491, -1598, 495, -1600, 497, -523, 490, -521, 492, -530, 490, -523, 490, -523, 490, -522, 490, -1598, 497, -523, 490, -523, 492, -521, 490, -1597, 496, -1641, 8180, -4007, 505, -1598, 497, -1596, 497, -1600, 496, -521, 493, -523, 489, -523, 490, -522, 491, -528, 491, -1599, 495, -523, 492, -520, 491, -1599, 497, -521, 490, -1597, 497, -1600, 495, -530, 490, -523, 490, -523, 490, -523, 489, -1598, 497, -1598, 497, -520, 492, -521, 492, -529, 491, -521, 491, -522, 492, -521, 490, -1600, 494, -523, 490, -523, 490, -523, 489, -1596, 495, -1642, 8179, -4004, 506, -1596, 497, -1597, 497, -1598, 495, -525, 489, -521, 491, -522, 491, -522, 490, -528, 492, -1597, 497, -521, 490, -523, 490, -1597, 497, -521, 490, -1597, 496, -1599, 495, -530, 490, -523, 490, -523, 489, -521, 490, -1598, 497, -1597, 497, -521, 491, -522, 490, -530, 490, -523, 490, -521, 492, -520, 491, -1599, 495, -523, 490, -522, 491, -520, 490, -1596, 496, -1640, 8177, -4005, 506, -1595, 497, -1598, 496, -1598, 496, -522, 491, -520, 492, -523, 490, -521, 491, -528, 491, -1597, 497, -521, 492, -520, 491, -1599, 495, -520, 491, -1597, 497, -1597, 495, -530, 490, -523, 490, -521, 492, -521, 490, -1597, 497, -1595, 498, -522, 490, -523, 490, -530, 489, -522, 490, -523, 490, -520, 491, -1597, 497, -522, 491, -522, 489, -522, 490, -1595, 495, -1640]
button:
  - platform: template
    name: "Battery Light Verified Power Off"
    on_press:
      - lambda: |-
          battery_guard::instance.active = false;
          battery_guard::instance.status = "Off sent (unconfirmed)";
          battery_guard::instance.action = "Manual Power Off transmitted";
      - script.execute: battery_light_off

api:
  actions:
    - action: diagnostic_snapshot
      then:
        - lambda: battery_guard::diagnostics.request_dump();
logger:
  tx_buffer_size: 2048
  on_message:
    - lambda: |-
        if (level <= 2 && strncmp(tag, "remote_receiver", 15) == 0)
          ++battery_guard::diagnostics.receiver_errors;
