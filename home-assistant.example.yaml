# Copy custom_components/battery_light_diagnostics into HA's /config/custom_components.
# Add this configuration (or use a package), run HA's configuration check, and restart HA.
battery_light_diagnostics:
  receivers:
    - id: primary
      host: !secret battery_light_primary_host
      expected_mac: !secret battery_light_primary_mac
      # password: !secret battery_light_primary_api_password
      # noise_psk: !secret battery_light_primary_api_encryption_key
    - id: secondary
      host: !secret battery_light_secondary_host
      expected_mac: !secret battery_light_secondary_mac
      # password: !secret battery_light_secondary_api_password
      # noise_psk: !secret battery_light_secondary_api_encryption_key
